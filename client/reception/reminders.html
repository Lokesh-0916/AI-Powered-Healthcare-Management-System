<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminders — Reception | HealthCare Portal</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="portal-reception">
  <div class="app-layout">
    <aside id="sidebar"></aside>
    <div class="main-content">
      <header id="topbar" class="topbar"></header>
      <main class="page-content page-enter">

        <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
          <select id="days-filter" class="form-select" style="max-width:200px;" onchange="loadReminders()">
            <option value="1">Tomorrow only</option>
            <option value="3">Next 3 days</option>
            <option value="7" selected>Next 7 days</option>
            <option value="14">Next 14 days</option>
            <option value="30">Next 30 days</option>
          </select>
        </div>

        <div id="reminders-content">
          <div class="loading-center"><div class="spinner spinner-lg"></div></div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/api.js?v=4"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/ui.js?v=4"></script>
  <script>
    const SIDEBAR_ITEMS = [
      { href: 'dashboard.html',    label: 'Dashboard',        match: 'dashboard' },
      { href: 'appointments.html', label: 'Appointments',     match: 'appointments' },
      { href: 'fees.html',         label: 'Fees',             match: 'fees' },
      { href: 'reminders.html',    label: 'Reminders',        match: 'reminders' },
      { href: 'logs.html',         label: 'Patients History', match: 'logs' },
    ];
    const user = Auth.require('staff');
    if (user) {
      renderSidebar(SIDEBAR_ITEMS, 'portal-reception');
      renderTopbar('Reminders', 'Upcoming appointments — who to call');
      loadReminders();
    }

    async function loadReminders() {
      const days = document.getElementById('days-filter').value;
      const container = document.getElementById('reminders-content');
      container.innerHTML = '<div class="loading-center"><div class="spinner spinner-lg"></div></div>';

      try {
        const data = await api.get(`/reception/reminders?days=${days}`);
        const appts = data.appointments || [];

        if (!appts.length) {
          container.innerHTML = '<div class="empty-state"><div class="empty-state-text">No upcoming appointments</div><div class="empty-state-sub">No appointments in the next ' + days + ' days.</div></div>';
          return;
        }

        // Group by date
        const byDate = {};
        appts.forEach(a => {
          const dateKey = new Date(a.date).toDateString();
          if (!byDate[dateKey]) byDate[dateKey] = [];
          byDate[dateKey].push(a);
        });

        const today = new Date();
        const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);

        container.innerHTML = Object.entries(byDate).map(([dateKey, dayAppts]) => {
          const d = new Date(dateKey);
          const isToday = d.toDateString() === today.toDateString();
          const isTomorrow = d.toDateString() === tomorrow.toDateString();
          const dayLabel = isToday ? 'Today' : isTomorrow ? 'Tomorrow' : formatDate(dateKey, {weekday:'long'});

          return `
            <div style="margin-bottom:24px;">
              <div style="font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px;">
                ${dayLabel}
                <span style="font-size:14px;color:var(--text-muted);">${formatDate(dateKey)}</span>
                <span class="badge badge-waiting">${dayAppts.length} apt${dayAppts.length > 1 ? 's' : ''}</span>
              </div>
              ${dayAppts.map(a => `
                <div class="card card-sm" style="display:flex;align-items:center;gap:16px;margin-bottom:10px;">
                  <div style="text-align:center;min-width:72px;">
                    <div style="font-size:15px;font-weight:800;color:var(--accent-reception);">${a.slot}</div>
                  </div>
                  <div style="width:1px;height:40px;background:var(--border);"></div>
                  <div style="flex:1;min-width:0;">
                    <div style="font-size:14px;font-weight:700;">${a.patient?.name || '—'}</div>
                    <div class="text-muted text-xs">with ${a.doctor?.name || '—'}</div>
                  </div>
                  <div style="text-align:right;">
                    ${a.patient?.contact
                      ? `<a href="tel:${a.patient.contact}" class="btn btn-primary btn-sm">${a.patient.contact}</a>`
                      : '<span class="text-muted text-sm">No contact saved</span>'
                    }
                  </div>
                  ${statusBadge(a.status)}
                </div>
              `).join('')}
            </div>
          `;
        }).join('');
      } catch (err) {
        Toast.error('Failed to load reminders: ' + err.message);
        container.innerHTML = '<div class="empty-state"><div class="empty-state-text">Failed to load</div><div class="empty-state-sub">' + err.message + '</div></div>';
      }
    }
  </script>
</body>
</html>
