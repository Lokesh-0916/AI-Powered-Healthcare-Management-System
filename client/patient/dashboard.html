<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Patient Portal | HealthCare Portal</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="portal-patient">
  <div class="app-layout">
    <aside id="sidebar"></aside>

    <div class="main-content">
      <header id="topbar" class="topbar"></header>

      <main class="page-content page-enter">

        <!-- Next Appointment (full width) -->
        <div class="section-title">Next Appointment</div>
        <div id="next-appt-card">
          <div class="loading-center"><div class="spinner"></div></div>
        </div>

        <!-- All Appointments full width -->
        <div class="section-title" style="margin-top:32px;">All Appointments</div>
        <div id="recent-appts">
          <div class="loading-center"><div class="spinner"></div></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/api.js?v=4"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/ui.js?v=4"></script>
  <script>
    const user = Auth.require('patient');
    if (user) {
      renderSidebar([
        { href: 'dashboard.html',     label: 'Dashboard',        match: 'dashboard' },
        { href: 'details.html',       label: 'My Details',       match: 'details' },
        { href: 'book.html',          label: 'Book Appointment', match: 'book' },
        { href: 'prescriptions.html', label: 'My Prescriptions', match: 'prescriptions' },
        { href: 'uploads.html',       label: 'My Reports',       match: 'uploads' },
        { href: 'ai-chat.html',       label: 'Ask AI',           match: 'ai-chat' },
      ]);
      renderTopbar('Dashboard', `Welcome back, ${user.name.split(' ')[0]}`);
      loadData();
    }

    async function loadData() {
      try {
        const [apptRes, uploadsRes] = await Promise.all([
          api.get('/patient/appointments'),
          api.get('/patient/uploads'),
        ]);

        const appts   = apptRes.appointments || [];
        const uploads = uploadsRes.uploads || [];

        // Next appointment
        const today = new Date().toLocaleDateString('en-CA');
        const upcoming = appts.filter(a => a.status !== 'done' && a.status !== 'cancelled' && new Date(a.date).toLocaleDateString('en-CA') >= today);
        
        function getActualDate(a) {
          const d = new Date(a.date);
          const [time, period] = a.slot.split(' ');
          let [h, m] = time.split(':').map(Number);
          if (period === 'PM' && h !== 12) h += 12;
          if (period === 'AM' && h === 12) h = 0;
          d.setHours(h, m, 0, 0);
          return d;
        }

        const next = upcoming.sort((a, b) => getActualDate(a) - getActualDate(b))[0];
        const nextEl = document.getElementById('next-appt-card');
        if (next) {
          // Strip "Dr." prefix if already present in doctor name
          const docName = (next.doctor?.name || '—').replace(/^Dr\.?\s*/i, '');
          nextEl.innerHTML = `
            <div class="glass-card" style="border-color:rgba(0,169,140,0.25);max-width:520px;">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;">
                <div>
                  <div style="font-size:22px;font-weight:800;color:var(--accent);">${next.slot}</div>
                  <div style="font-size:14px;color:var(--text-secondary);margin-top:4px;">${formatDate(next.date, {weekday:'long'})}</div>
                </div>
                ${statusBadge(next.status)}
              </div>
              <div style="font-size:15px;font-weight:600;margin-bottom:4px;">Dr. ${docName}</div>
              <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">${next.doctor?.specialization || 'General Physician'}</div>
              <div class="divider"></div>
              <div style="font-size:13px;color:var(--text-secondary);margin-top:12px;">${next.reason}</div>
            </div>
          `;
        } else {
          nextEl.innerHTML = emptyState('No upcoming appointments', '<a href="book.html" style="color:var(--accent)">Book one now →</a>');
        }

        // All appointments list
        const recentEl = document.getElementById('recent-appts');
        const recent   = appts;
        if (!recent.length) {
          recentEl.innerHTML = emptyState('No appointments yet', '');
        } else {
          recentEl.innerHTML = recent.map(a => {
            const docName = (a.doctor?.name || '—').replace(/^Dr\.?\s*/i, '');
            return `
              <div class="appt-card">
                <div class="appt-time">${a.slot}</div>
                <div class="appt-divider"></div>
                <div class="appt-info">
                  <div class="appt-name">Dr. ${docName}</div>
                  <div class="appt-reason">${a.reason}</div>
                </div>
                <div class="appt-meta">
                  <div style="font-size:12px;color:var(--text-muted);">${formatDate(a.date)}</div>
                  ${statusBadge(a.status)}
                </div>
              </div>
            `;
          }).join('');
        }
      } catch (err) {
        Toast.error('Failed to load dashboard: ' + err.message);
      }
    }

    // emptyState override for 2-arg calls
    function emptyState(title, subtitle) {
      return `
        <div class="empty-state">
          <div class="empty-state-text">${title}</div>
          ${subtitle ? `<div class="empty-state-sub">${subtitle}</div>` : ''}
        </div>
      `;
    }
  </script>
</body>
</html>
