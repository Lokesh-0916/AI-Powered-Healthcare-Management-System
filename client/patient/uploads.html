<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reports — Patient Portal | HealthCare Portal</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="portal-patient">
  <div class="app-layout">
    <aside id="sidebar"></aside>
    <div class="main-content">
      <header id="topbar" class="topbar"></header>
      <main class="page-content page-enter">

        <div>

          <!-- Upload zone + timeline -->
          <div>
            <div class="page-header">
              <h1>My Reports</h1>
              <p>Upload and manage your medical documents in one place.</p>
            </div>

            <!-- Drop zone -->
            <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
              <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.webp,.pdf" style="display:none;" multiple>
              <div class="drop-zone-icon" style="font-size:28px;font-weight:800;color:var(--text-muted);">+</div>
              <div class="drop-zone-text">Drag &amp; drop files here, or click to browse</div>
              <div class="drop-zone-sub">Supports JPG, PNG, WEBP, PDF · Max 10MB per file</div>
            </div>

            <!-- Upload form (shown after file selected) -->
            <div id="upload-form-area" style="display:none;margin-top:16px;" class="card">
              <div class="card-title" style="margin-bottom:16px;">File Details</div>
              <div id="selected-files-list" style="margin-bottom:16px;"></div>
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label" for="report-type">Report Type</label>
                  <select id="report-type" class="form-select">
                    <option value="labReport">Lab Report</option>
                    <option value="scan">Scan / X-Ray / MRI</option>
                    <option value="prescription">Prescription</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="report-date">Date of Report</label>
                  <input id="report-date" type="date" class="form-input">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="report-desc">Description (optional)</label>
                <input id="report-desc" type="text" class="form-input" placeholder="e.g. Complete blood count, post-op scan">
              </div>
              <div style="display:flex;gap:10px;">
                <button class="btn btn-primary" id="upload-btn" onclick="uploadFiles()">Upload</button>
                <button class="btn btn-ghost" onclick="cancelUpload()">Cancel</button>
              </div>
            </div>

            <!-- Timeline -->
            <div style="margin-top:32px;">
              <div class="section-title">Upload History</div>
              <div id="timeline-list">
                <div class="loading-center"><div class="spinner spinner-lg"></div></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/api.js?v=4"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/ui.js?v=4"></script>
  <script>
    const user = Auth.require('patient');
    let selectedFiles = [];

    if (user) {
      renderSidebar([
        { href: 'dashboard.html', label: 'Dashboard',        match: 'dashboard' },
        { href: 'details.html',   label: 'My Details',       match: 'details' },
        { href: 'book.html',      label: 'Book Appointment', match: 'book' },
        { href: 'ai-chat.html',   label: 'Ask AI',           match: 'ai-chat' },
        { href: 'uploads.html',   label: 'My Reports',       match: 'uploads' },
      ]);
      renderTopbar('My Reports', 'Manage your medical documents');
      loadUploads();
    }

    // Drag and drop
    const zone = document.getElementById('drop-zone');
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    document.getElementById('file-input').addEventListener('change', e => handleFiles(e.target.files));

    function handleFiles(files) {
      selectedFiles = Array.from(files);
      if (!selectedFiles.length) return;

      const listEl = document.getElementById('selected-files-list');
      listEl.innerHTML = selectedFiles.map(f => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-surface);border-radius:var(--radius-sm);margin-bottom:6px;">
          <span style="font-size:13px;font-weight:600;color:var(--text-muted);">${f.type.includes('pdf') ? 'PDF' : 'IMG'}</span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:600;truncate:ellipsis;white-space:nowrap;overflow:hidden;">${f.name}</div>
            <div class="text-muted text-xs">${formatFileSize(f.size)}</div>
          </div>
        </div>
      `).join('');

      // Default date to today
      document.getElementById('report-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('upload-form-area').style.display = '';
    }

    function cancelUpload() {
      selectedFiles = [];
      document.getElementById('upload-form-area').style.display = 'none';
      document.getElementById('file-input').value = '';
    }

    async function uploadFiles() {
      if (!selectedFiles.length) return;
      const btn = document.getElementById('upload-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Uploading...';

      let successCount = 0;
      for (const file of selectedFiles) {
        try {
          const fd = new FormData();
          fd.append('file', file);
          fd.append('type', document.getElementById('report-type').value);
          fd.append('reportDate', document.getElementById('report-date').value);
          fd.append('description', document.getElementById('report-desc').value);
          await api.upload('/patient/uploads', fd);
          successCount++;
        } catch (err) {
          Toast.error(`Failed to upload ${file.name}: ${err.message}`);
        }
      }

      if (successCount > 0) Toast.success(`${successCount} file(s) uploaded successfully!`);
      cancelUpload();
      loadUploads();
      btn.disabled = false;
      btn.textContent = 'Upload';
    }

    async function loadUploads() {
      try {
        const data = await api.get('/patient/uploads');
        const uploads = data.uploads || [];

        // Stats removed
        // Timeline
        const timelineEl = document.getElementById('timeline-list');
        if (!uploads.length) {
          timelineEl.innerHTML = '<div class="empty-state"><div class="empty-state-text">No reports uploaded yet</div><div class="empty-state-sub">Upload your first medical document above.</div></div>';
          return;
        }

        timelineEl.innerHTML = uploads.map(u => `
          <div class="card card-sm" style="display:flex;align-items:flex-start;gap:14px;margin-bottom:12px;">
            <div style="font-size:15px;font-weight:700;color:var(--text-muted);">${u.type === 'scan' ? 'SCAN' : u.type === 'labReport' ? 'LAB' : u.type === 'prescription' ? 'RX' : 'DOC'}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:700;">${u.originalName}</div>
              <div style="display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap;">
                <span class="badge badge-waiting" style="font-size:10px;">${uploadTypeLabel(u.type)}</span>
                <span class="text-muted text-xs">${u.reportDate ? formatDate(u.reportDate) : 'No date'}</span>
                <span class="text-muted text-xs">${formatFileSize(u.size)}</span>
              </div>
              ${u.description ? `<div class="text-secondary text-sm mt-1">${u.description}</div>` : ''}
            </div>
            <div style="display:flex;gap:6px;flex-shrink:0;">
              <a href="http://localhost:5000/uploads/${u.filename}" target="_blank" class="btn btn-ghost btn-sm" title="View file">View</a>
              <button class="btn btn-danger btn-sm" title="Delete" onclick="deleteUpload('${u._id}', this)">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        Toast.error('Failed to load uploads: ' + err.message);
      }
    }

    async function deleteUpload(id, btn) {
      if (!confirm('Delete this file? This cannot be undone.')) return;
      btn.disabled = true;
      try {
        await api.delete(`/patient/uploads/${id}`);
        Toast.success('File deleted.');
        loadUploads();
      } catch (err) {
        Toast.error('Delete failed: ' + err.message);
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
